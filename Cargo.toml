[workspace]
members  = ["crates/*"]
resolver = "3"

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.95"
license      = "Apache-2.0"
authors      = ["Fabricio Archanjo <farchanjo@gmail.com>"]
repository   = "https://github.com/farchanjo/schema"
readme       = "README.md"

[profile.release]
opt-level     = 3
lto           = "thin"
codegen-units = 1
strip         = "symbols"

# ─── Strict lint baseline — all three layers active (ADR-0012) ────────
# Layer A: safety + output-critical clippy lints at `forbid` (no escape
# via #[allow]/#[expect]). Carve-outs documented in ADR-0012:
#   - `unwrap_used` and `expect_used` stay at `deny` for test fixtures
#     (narrow `#[expect(..., reason = "...")]` per-module is the
#     canonical escape, which `forbid` would block).
# Layer B: group denies + 29 explicit quality denies. Group priority -1
# so individual `deny` overrides take precedence; `multiple_crate_versions`
# allowed because transitive dep churn is outside our control.
# Layer C: rustc anti-dead-code + anti-cruft lints (below). `unsafe_code`
# at `deny` (downgraded from `forbid` per ADR-0012 amendment 2026-04-25).
#
# Per ADR-0034, the lint policy lives at the workspace level so every
# member crate inherits it via `[lints] workspace = true` in its own
# Cargo.toml. Re-opening any lint requires an ADR amending ADR-0012.
[workspace.lints.clippy]
# Layer A — forbid
panic         = { level = "forbid", priority = 1 }
todo          = { level = "forbid", priority = 1 }
unimplemented = { level = "forbid", priority = 1 }
dbg_macro     = { level = "forbid", priority = 1 }
exit          = { level = "forbid", priority = 1 }
mem_forget    = { level = "forbid", priority = 1 }
infinite_loop = { level = "forbid", priority = 1 }
print_stdout  = { level = "forbid", priority = 1 }
print_stderr  = { level = "forbid", priority = 1 }

# Layer A — deny (test-fixture carve-out per ADR-0012)
unwrap_used   = "deny"
expect_used   = "deny"

# Layer B — group denies (priority -1 lets individual lints override)
all      = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
nursery  = { level = "deny", priority = -1 }
cargo    = { level = "deny", priority = -1 }

# Layer B — quality denies (skill section 1, Layer B)
wildcard_enum_match_arm         = "deny"
as_conversions                  = "deny"
clone_on_ref_ptr                = "deny"
map_err_ignore                  = "deny"
implicit_clone                  = "deny"
if_then_some_else_none          = "deny"
rc_mutex                        = "deny"
empty_structs_with_brackets     = "deny"
redundant_type_annotations      = "deny"
same_name_method                = "deny"
tests_outside_test_module       = "deny"
large_include_file              = "deny"
renamed_function_params         = "deny"
rest_pat_in_fully_bound_structs = "deny"
ref_patterns                    = "deny"
format_push_string              = "deny"
string_lit_as_bytes             = "deny"
unseparated_literal_suffix      = "deny"
semicolon_inside_block          = "deny"
needless_raw_strings            = "deny"
needless_raw_string_hashes      = "deny"
missing_asserts_for_indexing    = "deny"
pub_use                         = "deny"
absolute_paths                  = "deny"
allow_attributes_without_reason = "deny"
allow_attributes                = "deny"

# Carve-out per ADR-0012: transitive dep version churn is outside our control.
multiple_crate_versions = "allow"

# Layer C: rustc anti-dead-code + anti-cruft lints. `unsafe_code` at
# `deny` (downgraded from `forbid` per ADR-0012 amendment 2026-04-25):
# `sqlite-vec` 0.1.9 only exposes its loader as a raw `extern "C"`
# symbol with no safe wrapper; ADR-0011 needs exactly one narrow
# `#[expect(unsafe_code, reason = "...")]` call at extension load
# time in `adapters/sqlite_vec_store.rs`. Every other call site in
# the crate stays at `deny` — `expect` self-expires when removed.
[workspace.lints.rust]
unsafe_code                   = "deny"
dead_code                     = "deny"
unused_imports                = "deny"
unused_variables              = "deny"
unused_mut                    = "deny"
unused_must_use               = "deny"
unused_assignments            = "deny"
unreachable_code              = "deny"
unreachable_patterns          = "deny"
unused_crate_dependencies     = "deny"
unused_lifetimes              = "deny"
unused_qualifications         = "deny"
single_use_lifetimes          = "warn"
trivial_numeric_casts         = "deny"
trivial_casts                 = "deny"
let_underscore_drop           = "deny"
missing_debug_implementations = "warn"
future_incompatible           = { level = "deny", priority = -1 }
rust_2018_idioms              = { level = "deny", priority = -1 }
rust_2024_compatibility       = { level = "warn", priority = -1 }
