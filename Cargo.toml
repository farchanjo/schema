[package]
name = "schema"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
description = "MCP server for indexing project specs, ADRs, contracts, and glossaries via local RAG (bge-m3 + LanceDB)"
authors = ["Fabricio Archanjo <farchanjo@gmail.com>"]
repository = "https://github.com/archanjoeti/mcp-schema"
readme = "README.md"
keywords = ["mcp", "rag", "embeddings", "adr", "specs"]
categories = ["development-tools", "command-line-utilities"]

[[bin]]
name = "schema"
path = "src/main.rs"

[dependencies]
# MCP — Model Context Protocol Rust SDK
# Features required:
#   server        — server-side handler infrastructure
#   macros        — #[tool] and #[tool_router] attribute macros
#   transport-io  — stdio transport (rmcp::transport::stdio)
rmcp = { version = "1.5", features = ["server", "macros", "transport-io"] }

# Async runtime
# `test-util` powers `tokio::test(start_paused = true)` and
# `tokio::time::advance(...)` in the watcher consumer's debounce tests.
tokio = { version = "1.52", features = ["full", "test-util"] }
futures = "0.3"

# CLI
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1"
thiserror = "2"

# Embeddings (bge-m3 via ort/ONNX Runtime)
fastembed = "5.13"

# Vector store (LanceDB — embedded, columnar, MVCC)
lancedb = "0.27"
arrow-array = "57"
arrow-schema = "57"

# Filesystem
walkdir = "2.5"
fd-lock = "4.0"
dirs = "6"

# Markdown + config
pulldown-cmark = "0.13"
toml = "1.1"

# Time + hashing
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1.8"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

# Filesystem watcher — kqueue on macOS (per ADR-0010); inotify is the
# automatic Linux backend (no feature flag needed; not exposed as one in
# notify 8.x). On Linux we accept defaults.
[target.'cfg(target_os = "macos")'.dependencies.notify]
version = "8.2"
default-features = false
features = ["macos_kqueue"]

[target.'cfg(not(target_os = "macos"))'.dependencies]
notify = "8.2"

[dev-dependencies]
tempfile = "3.27"
insta = { version = "1.47", features = ["yaml"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"

# ─── Strict lint baseline (Layer A + Layer C only — Layer B deferred) ──
# Layer A: safety + output-critical clippy lints.
# All at `deny` rather than `forbid` because:
#   1. derive macros (e.g., `#[derive(clap::Parser)]`) inject internal
#      `allow(clippy::restriction)` attributes. With Layer A at `forbid`
#      the compiler refuses these allows (E0453); macro-driven code
#      stops compiling.
#   2. test code legitimately uses `unwrap()` for fixture setup; narrow
#      `#[allow(..., reason = "...")]` per-module is the canonical
#      escape, which `forbid` blocks.
# `deny` still blocks regressions in CI (`-D warnings` makes them
# errors) while letting `#[allow]` rescue legitimate exceptions.
[lints.clippy]
unwrap_used   = "deny"
expect_used   = "deny"
panic         = "deny"
todo          = "deny"
unimplemented = "deny"
dbg_macro     = "deny"
exit          = "deny"
mem_forget    = "deny"
infinite_loop = "deny"
print_stdout  = "deny"
print_stderr  = "deny"

# Layer C: rustc anti-dead-code + anti-cruft lints. unsafe_code is
# `forbid` because schema has no need for unsafe blocks; if FASE 2 ever
# requires `unsafe`, downgrade to `deny` deliberately via an ADR.
[lints.rust]
unsafe_code                   = "forbid"
dead_code                     = "deny"
unused_imports                = "deny"
unused_variables              = "deny"
unused_mut                    = "deny"
unused_must_use               = "deny"
unused_assignments            = "deny"
unreachable_code              = "deny"
unreachable_patterns          = "deny"
unused_crate_dependencies     = "deny"
unused_lifetimes              = "deny"
unused_qualifications         = "deny"
single_use_lifetimes          = "warn"
trivial_numeric_casts         = "deny"
trivial_casts                 = "deny"
let_underscore_drop           = "deny"
missing_debug_implementations = "warn"
future_incompatible           = { level = "deny", priority = -1 }
rust_2018_idioms              = { level = "deny", priority = -1 }
rust_2024_compatibility       = { level = "warn", priority = -1 }
